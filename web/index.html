<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The archive private key lives in this page. Hosted builds permit only
         the dedicated session bridge frame. frame-ancestors is absent — a browser ignores it
         in a meta element and warns — so the server sets it, together with
         X-Frame-Options, in internal/webui. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; worker-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-src 'none'; base-uri 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Wappie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
