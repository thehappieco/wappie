# Development dependencies only. Ports are shifted off the defaults so this
# never collides with another Postgres already running on the machine.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: whatserver
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: whatserver2
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatserver -d whatserver2"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: whatserver
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 whatserver devdevdev &&
      mc mb --ignore-existing local/whatserver2-media &&
      echo bucket ready"

volumes:
  pgdata:
  miniodata:
