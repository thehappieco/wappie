server {
    listen 80;
    server_name wappie.thehappie.co console.wappie.thehappie.co app.wappie.thehappie.co api.wappie.thehappie.co;
    location /.well-known/acme-challenge/ { root /var/www/wappie-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name wappie.thehappie.co;
    ssl_certificate /etc/letsencrypt/live/wappie.thehappie.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wappie.thehappie.co/privkey.pem;
    root /opt/wappie/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 443 ssl;
    server_name console.wappie.thehappie.co app.wappie.thehappie.co api.wappie.thehappie.co;
    ssl_certificate /etc/letsencrypt/live/wappie.thehappie.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wappie.thehappie.co/privkey.pem;
    client_max_body_size 256m;
    location ~ ^/(metrics|healthz|readyz) { return 404; }
    location ^~ /v1/billing {
        proxy_pass http://127.0.0.1:18091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
