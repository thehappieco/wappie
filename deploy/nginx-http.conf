# Initial HTTP-only routing for ACME. HTTPS activation follows DNS validation.
server {
    listen 80;
    server_name wappie.thehappie.co console.wappie.thehappie.co app.wappie.thehappie.co api.wappie.thehappie.co;
    location /.well-known/acme-challenge/ { root /var/www/wappie-acme; }
    location / { return 503; }
}
