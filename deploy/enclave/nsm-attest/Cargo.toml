# In-enclave NSM helpers for the Wappie reader (deploy/enclave), built in a
# rust:1-alpine stage (musl targets link statically by default):
# - nsm-attest (src/main.rs): one attestation document on stdout;
# - nsm-timefeed (src/bin/nsm-timefeed.rs): the long-running feed of NSM time
#   to chronyd, with its logic in src/timefeed/ (the library, so it can be
#   unit-tested).
[package]
name = "nsm-attest"
version = "0.1.0"
edition = "2021"
# aws-nitro-enclaves-nsm-api 0.5.x declares rust-version 1.92.
rust-version = "1.92"
publish = false

# Exact pins: the binary is measured into PCR0/PCR2, so dependency drift
# would change the image. Default features stay on: the driver module
# (/dev/nsm ioctl) only exists with the nsm-api "nix" feature.
[dependencies]
aws-nitro-enclaves-nsm-api = "=0.5.2"
serde_bytes = "=0.11.19"
hex = "=0.4.3"
# nsm-timefeed: COSE_Sign1 outer array, and the clocks, adjtimex, alarm and
# getrandom. Both were already in Cargo.lock as nsm-api's dependencies.
serde_cbor = "=0.11.2"
libc = "=0.2.189"

[features]
# Probe builds only (deploy/enclave/clockprobe): scales the NSM time the feed
# reports by +200 ppm, to test chrony's frequency cap. The image builds with
# no features, and its nsm-timefeed must not contain WAPPIE_FAKE_DRIFT.
fake-drift = []

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
