# Every chronyd run after the first in an enclave boot
# (/usr/local/sbin/wappie-clock-start). No makestep: a restarted chronyd never
# steps the clock.
include /etc/chrony/common.conf
# Any correction over 5 s, from the first update on, makes chronyd exit
# again. A restart therefore recovers only while the clock is within 5 s.
maxchange 5 0 0
