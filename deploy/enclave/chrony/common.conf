# chronyd's settings shared by boot.conf and run.conf (deploy/enclave/chrony,
# docs/mcp-enclave.md, Clock). Installed read-only as /etc/chrony/common.conf.
#
# The only time source is the Nitro Secure Module, fed by nsm-timefeed: one
# sample every 4 s through this socket (chronyd creates it). poll 5 is 32 s,
# so each poll filters 8 samples. The NSM timestamp is in milliseconds.
refclock SOCK /run/chrony/nsm.sock refid NSM poll 5 filter 8 precision 1e-3
# Together these cap the correction at about 110 ppm of the raw clock:
# 0.4 s an hour and 9.5 s a day. nsm-timefeed's ledger watches the same
# budget independently (5 s an hour, 10 s a day).
# Slewing at most 60 ppm (0.216 s an hour).
maxslewrate 60
# Frequency correction at most 50 ppm (4.3 s a day).
maxdrift 50
# No command socket and no NTP socket. Both are compiled out or unused in
# this build (deploy/enclave/Dockerfile, chrony stage); these make it so even
# if they were not.
cmdport 0
port 0
pidfile /run/chrony/chronyd.pid
# Deliberately absent: server, pool and peer (no network source), allow (no
# clients), driftfile and dumpdir (nothing survives a boot), logdir (the
# enclave has no log channel for chronyd), rtcsync (no RTC).
