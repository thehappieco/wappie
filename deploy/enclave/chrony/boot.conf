# chronyd's first run of an enclave boot (/usr/local/sbin/wappie-clock-start).
include /etc/chrony/common.conf
# The one step: on the first clock update only, and only if the clock is off
# by more than 0.5 s. makestep has no upper bound of its own; nsm-timefeed
# never feeds a first sample more than 600 s away (its boot gate).
makestep 0.5 1
# After that first update, any correction over 5 s makes chronyd exit
# (1 update skipped, 0 ignored). The reader then fails closed.
maxchange 5 1 0
