# Standalone server; supply PostgreSQL 18 and optional S3-compatible storage.
# Configuration stays in ../.env, outside source control.
name: wappie-server
services:
  api:
    image: wappie-server:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      WS_HTTP_ADDR: :8090
      WS_METRICS_ADDR: :9090
      WS_WEB_DIR: ""
    ports: ["127.0.0.1:8090:8090"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
