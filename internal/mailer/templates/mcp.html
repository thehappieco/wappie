<!doctype html>
<html lang="{{.Lang}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no"><title>{{.Subject}}</title></head>
<body style="margin:0;padding:0;background-color:#f1f5f4;color:#172e2b;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;font-size:1px;color:#f1f5f4;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{.Preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f4;"><tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:560px;">
      <tr><td style="padding:0 0 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td width="48"><img src="cid:wappie-brand" width="44" height="44" alt="" style="display:block;border:0;border-radius:12px;"></td><td style="padding-left:10px;"><div style="font-size:26px;font-weight:bold;letter-spacing:-1px;color:#173d34;">Wappie</div><div style="font-size:11px;letter-spacing:1.3px;color:#638178;padding-top:2px;">BY THE HAPPIE</div></td></tr></table>
      </td></tr>
      <tr><td bgcolor="#ffffff" style="padding:32px 28px;border:1px solid #dce7e3;border-top:4px solid #087f67;border-radius:16px;background-color:#ffffff;">
        <p style="margin:0 0 14px;font-size:11px;line-height:16px;letter-spacing:1.4px;font-weight:bold;color:#087f67;">{{.Kicker}}</p>
        <h1 style="margin:0 0 18px;font-size:27px;line-height:34px;letter-spacing:-0.5px;color:#173d34;font-weight:bold;">{{.Title}}</h1>
        <p style="margin:0 0 18px;font-size:15px;line-height:25px;color:#50675f;word-break:break-word;">{{.Intro}}</p>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:16px 18px;background-color:#f1f7f4;border:1px solid #deebe5;border-radius:10px;">{{range .Facts}}<div style="font-size:14px;line-height:23px;color:#173d34;word-break:break-word;">{{.}}</div>{{end}}</td></tr></table>
        <p style="margin:28px 0 12px;font-size:15px;line-height:23px;color:#173d34;font-weight:bold;">{{.Question}}</p>
        {{if .Link}}<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td align="center" bgcolor="#087f67" style="border-radius:9px;background-color:#087f67;"><a href="{{.Link}}" style="display:inline-block;padding:16px 26px;border:1px solid #087f67;border-radius:9px;font-size:15px;line-height:20px;font-weight:bold;color:#ffffff;text-decoration:none;">{{.Action}}</a></td></tr></table>
        <p style="margin:24px 0 8px;font-size:12px;line-height:19px;color:#71857e;">{{.LinkHelp}}</p>
        <p style="margin:0;font-size:11px;line-height:18px;word-break:break-all;overflow-wrap:anywhere;"><a href="{{.Link}}" style="color:#087f67;text-decoration:underline;word-break:break-all;overflow-wrap:anywhere;">{{.Link}}</a></p>{{else}}<p style="margin:0;font-size:15px;line-height:25px;color:#50675f;word-break:break-word;">{{.Steps}}</p>{{end}}
      </td></tr>
      <tr><td style="padding:24px 12px 0;text-align:center;"><p style="margin:0 0 10px;font-size:12px;line-height:20px;color:#6c8278;">{{.Footer}}</p><p style="margin:0;font-size:11px;line-height:18px;color:#81938a;">Wappie · The Happie</p></td></tr>
    </table>
  </td></tr></table>
</body>
</html>
