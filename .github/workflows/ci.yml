name: ci

on:
  push: {branches: [main]}
  pull_request:

env:
  GO_VERSION: "1.26.7"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # uuidv7() and the RLS behaviour this schema relies on need 18.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}

      # A non-superuser, non-BYPASSRLS role. Superusers ignore row-level
      # security, so running the isolation tests as one would make them pass no
      # matter how broken the policies were.
      - name: Create the application role and database
        env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE whatserver2_app LOGIN PASSWORD 'dev' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE whatserver2_test OWNER whatserver2_app;"

      - run: go build ./...

      - name: Tests
        env:
          WS_TEST_POSTGRES_DSN: postgres://whatserver2_app:dev@localhost:5432/whatserver2_test?sslmode=disable
          # Turns "no database, skipping" into a failure. Without this the
          # isolation and migration tests could silently stop running.
          WS_TEST_POSTGRES_REQUIRED: "1"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage floor for the domain packages
        run: |
          go tool cover -func=coverage.out > cov.txt
          tail -1 cov.txt
          fail=0
          # Packages carrying real business or cryptographic logic. Plumbing is
          # deliberately not on this list.
          for pkg in internal/crypto/wamedia internal/config internal/obs internal/mcpauth; do
            pct=$(grep "whatserver2/$pkg/" cov.txt | awk '{gsub("%","",$NF); s+=$NF; n++} END {if(n) printf "%.1f", s/n; else print 0}')
            echo "$pkg: $pct%"
            awk -v p="$pct" 'BEGIN {exit !(p < 80)}' && { echo "  below the 80% floor"; fail=1; }
          done
          exit $fail

      - name: Fuzz smoke
        run: make fuzz

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - run: make fmt
      - run: make vet
      # The whatsapp_server2 project rotted when a half-finished migration left
      # API_ttt/ and mongo_ttt/ beside the real packages forever.
      - run: make lint-layout
      - uses: golangci/golangci-lint-action@v9.3.0
        with: {version: v2.13.2}
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/client/package-lock.json
            packages/mcp/package-lock.json
            packages/mcp-http/package-lock.json
      - run: npm ci
        working-directory: packages/client
      - run: npm run typecheck && npm test && npm run build
        working-directory: packages/client
      - run: npm pack --dry-run
        working-directory: packages/client
      - run: npm ci && npm test
        working-directory: packages/cli
      - run: npm ci && npm test && npm pack --dry-run
        working-directory: packages/mcp
      # Plain npm ci, no --install-links: the symlinked file: layout is the one
      # that can resolve a second copy of the MCP SDK, so it is the one to test.
      - run: npm ci && npm test && npm pack --dry-run
        working-directory: packages/mcp-http

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "${{ env.GO_VERSION }}", cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python3 scripts/export-public.py --output /tmp/wappie-source.tar.gz
      - run: |
          mkdir /tmp/wappie-source
          tar -xzf /tmp/wappie-source.tar.gz -C /tmp/wappie-source
          cd /tmp/wappie-source
          go build ./...
          go test ./internal/crypto/...
          npm --prefix packages/client ci
          npm --prefix packages/client run build
          npm --prefix packages/mcp ci
          npm --prefix packages/mcp test
          (cd packages/mcp && npm pack --dry-run)
          npm --prefix packages/mcp-http ci
          npm --prefix packages/mcp-http test
          (cd packages/mcp-http && npm pack --dry-run)

  container-mcp-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only; nothing is pushed. The image is the self-hosting artifact
      # for the remote MCP reader, so it must keep building from the public tree.
      - run: docker build -f deploy/Dockerfile.mcp-http -t wappie-mcp-http:ci .
      # The smoke test proves the loopback + relay-bearer guards from inside a
      # container namespace, the layout self-hosters get from deploy/compose.yaml.
      - run: deploy/smoke-mcp-http.sh wappie-mcp-http:ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The v1 repo committed cmd/wapanel/config.yaml holding a live api_key
      # and media_signing_key_hex. Configuration here is environment-only, and
      # this job is the backstop.
      # The open-source CLI does not require the commercial organization's action license.
      - name: Scan source history for secrets
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --config .gitleaks.toml .
