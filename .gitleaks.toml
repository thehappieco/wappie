[extend]
useDefault = true

[[allowlists]]
description = "Generated cryptographic interoperability vectors; these test keys protect no real data"
paths = [
 '''internal/crypto/seal/testdata/vectors\.json$''',
 '''internal/crypto/seal/testdata/draft-vectors\.json$''',
 '''internal/crypto/wamedia/testdata/vectors\.json$''',
 '''internal/wsapi/testdata/frames\.json$''',
 '''internal/store/testdata/archive-key-fingerprints\.json$''',
 '''web/testdata/browser-grant\.json$''',
 '''packages/client/testdata/browser-grant\.json$''',
 '''packages/client/testdata/node-draft\.json$''',
 # Copies of the shared kit's vectors (github.com/thehappieco/kit, vectors/wappie/golden).
 '''packages/client/test/kit/[a-z-]+\.json$''',
 '''packages/mcp-http/enclave/test/kit/[a-z-]+\.json$'''
]

[[allowlists]]
description = "Deterministic WhatsApp media test key (byte progression), reused by upload fixture"
regexTarget = "secret"
regexes = ['''HyIlKCsuMTQ3Oj1AQ0ZJTE9SVVhbXmFkZ2ptcHN2eXw=''']

[[allowlists]]
description = "Documented HMAC test-vector secret for the enclave relay (docs/mcp-enclave.md); it signs nothing real"
regexTarget = "secret"
regexes = ['''^wappie-test-relay-secret-0123456789abcdefghij$''']

[[allowlists]]
description = "Archive key fingerprint vectors (DS49): the SHA-256 of a zero key and of bytes 0 to 31; they name no real key"
regexTarget = "secret"
regexes = ['''^66687aadf862bd776c8fc18b8e9f8e20089714856ee233b3902a591d0d5f2925$''', '''^630dcd2966c4336691125448bbb25b4ff412a49c732db2c8abc1b8581bd710dd$''']
